name: Universe MCP Tests

on:
  push:
    paths:
      - 'src/aria_esi/universe/**'
      - 'src/aria_esi/mcp/**'
      - 'src/aria_esi/store/**'
      - 'tests/mcp/**'
      - 'tests/universe/**'
      - 'tests/integration/**'
      - 'tests/benchmarks/**'
      - 'tests/conftest.py'
  pull_request:
    paths:
      - 'src/aria_esi/universe/**'
      - 'src/aria_esi/mcp/**'
      - 'src/aria_esi/store/**'
      - 'tests/mcp/**'
      - 'tests/universe/**'
      - 'tests/integration/**'
      - 'tests/benchmarks/**'
      - 'tests/conftest.py'

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Universe MCP Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run MCP unit tests
        run: |
          uv run pytest tests/mcp/ tests/universe/ -v --tb=short --no-cov

      - name: Run integration tests
        run: |
          uv run pytest tests/integration/ -v --tb=short -m "integration" --no-cov

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: test
    # Only run benchmarks on main branch or manual trigger
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Check for universe graph
        id: graph-check
        run: |
          if [ -f "src/aria_esi/data/universe.universe" ]; then
            echo "graph_exists=true" >> $GITHUB_OUTPUT
          else
            echo "graph_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify universe graph
        if: steps.graph-check.outputs.graph_exists == 'true'
        run: uv run aria-esi graph-verify

      - name: Run benchmarks
        if: steps.graph-check.outputs.graph_exists == 'true'
        run: |
          uv run pytest tests/benchmarks/ -v -m "benchmark" --benchmark-enable --benchmark-json=benchmark.json --no-cov

      - name: Upload benchmark results
        if: steps.graph-check.outputs.graph_exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark.json

      - name: Skip benchmarks notice
        if: steps.graph-check.outputs.graph_exists == 'false'
        run: echo "Benchmarks skipped - universe graph not available"

  verify-graph:
    name: Verify Universe Graph
    runs-on: ubuntu-latest
    needs: test
    # Only verify on main branch
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Check for universe graph
        id: graph-check
        run: |
          if [ -f "src/aria_esi/data/universe.universe" ]; then
            echo "graph_exists=true" >> $GITHUB_OUTPUT
          else
            echo "graph_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify graph integrity
        if: steps.graph-check.outputs.graph_exists == 'true'
        run: uv run aria-esi graph-verify

      - name: Skip verify notice
        if: steps.graph-check.outputs.graph_exists == 'false'
        run: echo "Graph verification skipped - universe graph not committed"
