notes:
  purpose: "L2 mission runner using afterburner for better sig tanking and cap stability"
  engagement: "Orbit at 30-40km with AB, let missiles do the work"
  warnings:
    - "AB is slower than MWD but keeps sig radius small - takes less damage"
    - "Dual multispectrum hardeners provide omni resist without swapping"
    - "EM shield reinforcer rig plugs the shield EM hole"
    - "3x T2 BCS for maximum missile DPS"
    - "Meta launchers (Arbalest) - good DPS without Light Missiles V"
    - "Faction drones for extra anti-frigate punch"

