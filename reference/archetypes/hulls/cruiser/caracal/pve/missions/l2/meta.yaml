# Caracal L2 Missions - Medium Skill Variant
#
# Solid mid-level fit for established pilots.
# Improved tank and DPS over low skill variant.

archetype:
  hull: Caracal
  skill_tier: meta
  omega_required: false
roles:
  - missions-l2

eft: |
  [Caracal, L2 Missions - Medium Skills]

  Ballistic Control System I
  Ballistic Control System I
  Damage Control I
  Nanofiber Internal Structure I

  50MN Y-T8 Compact Microwarpdrive
  Large Shield Extender I
  Large Shield Extender I
  Multispectrum Shield Hardener I
  EM Shield Hardener I

  Rapid Light Missile Launcher I
  Rapid Light Missile Launcher I
  Rapid Light Missile Launcher I
  Rapid Light Missile Launcher I
  Rapid Light Missile Launcher I

  Medium Core Defense Field Extender I
  Medium Core Defense Field Extender I
  Medium Core Defense Field Extender I

  Hobgoblin I x2

  Scourge Light Missile x1000

skill_requirements:
  required:
    Caldari Cruiser: 3
    Missile Launcher Operation: 4
    Light Missiles: 4
    Shield Upgrades: 3
    Shield Management: 3
    Weapon Upgrades: 3
  recommended:
    Rapid Launch: 3
    Warhead Upgrades: 3
    Target Navigation Prediction: 3
    Guided Missile Precision: 3

stats:
  dps: null  # missile DPS from cargo ammo not calculated by EOS
  ehp: 30534
  align_time: 7.0
  speed_mwd: 2044
  validated_date: "2026-02-27"

damage_tuning:
  default_damage: kinetic
  tank_profile: shield_buffer

  overrides:
    serpentis:
      ammo: "Inferno Light Missile"
      notes: "Serpentis weak to Thermal"

    angel_cartel:
      ammo: "Nova Light Missile"
      notes: "Angels weak to Explosive"

    blood_raiders:
      ammo: "Mjolnir Light Missile"
      notes: "Blood Raiders weak to EM"

    guristas:
      ammo: "Scourge Light Missile"
      notes: "Guristas weak to Kinetic - default ammo works"

    rogue_drones:
      ammo: "Mjolnir Light Missile"
      notes: "Drones weak to EM"

    mercenaries:
      ammo: "Inferno Light Missile"
      notes: "Mercenaries weak to Thermal"

notes:
  purpose: "General-purpose L2 mission runner for pilots with moderate skills"
  engagement: "Orbit at 35-45km with MWD, let missiles do the work"
  warnings:
    - "Buffer tank - warp out when shields get low"
    - "Pulse MWD to manage cap"

upgrade_path:
  next_tier: t2_optimal
  key_upgrades:
    - module: "Rapid Light Missile Launcher I"
      upgrade_to: "Rapid Light Missile Launcher II"
      skill_required: "Light Missiles 5"
    - module: "Multispectrum Shield Hardener I"
      upgrade_to: "Multispectrum Shield Hardener II"
      skill_required: "Tactical Shield Manipulation 4"
