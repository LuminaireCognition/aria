# Caracal T1 Abyssal - Entry-Level HAM Active Shield
#
# T1 fit for entry-level Abyssal Deadspace (Tier 1).
# Active shield booster tank with cap battery for sustainability.
# Heavy Assault Missiles for close-range DPS against cruiser NPCs.

archetype:
  hull: Caracal
  skill_tier: t1
  omega_required: false

eft: |
  [Caracal, T1 Abyssal Caracal]
  Ballistic Control System I
  Ballistic Control System I
  Ballistic Control System I
  IFFA Compact Damage Control

  10MN Y-S8 Compact Afterburner
  Large C5-L Compact Shield Booster
  Large Compact Pb-Acid Cap Battery
  Compact EM Shield Amplifier
  X5 Enduring Stasis Webifier

  Prototype 'Arbalest' Heavy Assault Missile Launcher I
  Prototype 'Arbalest' Heavy Assault Missile Launcher I
  Prototype 'Arbalest' Heavy Assault Missile Launcher I
  Prototype 'Arbalest' Heavy Assault Missile Launcher I
  Prototype 'Arbalest' Heavy Assault Missile Launcher I

  Medium Ancillary Current Router I
  Medium Ancillary Current Router I
  Medium Ancillary Current Router I


  Hornet I x2

  Scourge Heavy Assault Missile x300

skill_requirements:
  required:
    Caldari Cruiser: 2
    Missile Launcher Operation: 3
    Heavy Assault Missiles: 2
    Shield Operation: 3
    Shield Management: 2
  recommended:
    Heavy Assault Missiles: 3
    Warhead Upgrades: 2
    Target Navigation Prediction: 2
    Capacitor Management: 3

stats:
  # Pending EOS validation - run 'aria-esi eos-seed' then recalculate
  validated_date: null

damage_tuning:
  default_damage: kinetic
  tank_profile: shield_active

  overrides:
    electrical:
      ammo: "Mjolnir Heavy Assault Missile"
      notes: "Electrical weather - EM damage, watch cap drain"

    exotic:
      ammo: "Scourge Heavy Assault Missile"
      notes: "Exotic weather - Kinetic damage, default ammo works"

    firestorm:
      ammo: "Nova Heavy Assault Missile"
      notes: "Firestorm weather - avoid with shield tank"

    gamma:
      ammo: "Inferno Heavy Assault Missile"
      notes: "Gamma weather - Thermal damage, shield penalty"

    dark:
      ammo: "Scourge Heavy Assault Missile"
      notes: "Dark weather - reduced range, stay close"

notes:
  purpose: "Entry-level Abyssal Deadspace Tier 1 runner"
  engagement: "AB orbit at 5-10km, web dangerous targets, active shield boost"
  warnings:
    - "Tier 1 only - do not attempt higher tiers with this fit"
    - "AVOID Firestorm and Gamma weather types (shield penalties)"
    - "Electrical and Exotic are best for shield tanks"
    - "Cap battery essential for cap stability under neut pressure"
    - "Web priority targets: close-range DPS ships, Triglavian cruisers"
    - "3x ACR rigs needed to fit HAM launchers - tight powergrid"
    - "20-minute timer - manage DPS to clear rooms on time"

upgrade_path:
  next_tier: meta
  key_upgrades:
    - module: "Ballistic Control System I"
      upgrade_to: "Ballistic Control System II"
      skill_required: "Weapon Upgrades 4"
    - module: "Prototype 'Arbalest' Heavy Assault Missile Launcher I"
      upgrade_to: "Heavy Assault Missile Launcher II"
      skill_required: "Heavy Assault Missiles 5"
    - module: "Large C5-L Compact Shield Booster"
      upgrade_to: "Large Shield Booster II"
      skill_required: "Shield Operation 4"
