# Epithal Highsec PI Hauling - Low Skill Variant
#
# Specialized PI product hauler for highsec.
# Fast align with inertial stabilizers.
# Dedicated PI hold (not general cargo).

archetype:
  hull: Epithal
  skill_tier: t1
  omega_required: false
roles:
  - hauling-hisec
source: eveuni

eft: |
  [Epithal, Highsec PI Hauling]

  Inertial Stabilizers I
  Inertial Stabilizers I
  Nanofiber Internal Structure I
  Damage Control I

  10MN Afterburner I
  Medium Shield Extender I
  Multispectrum Shield Hardener I

  [Empty High slot]
  [Empty High slot]

  Medium Low Friction Nozzle Joints I
  Medium Low Friction Nozzle Joints I
  Medium Low Friction Nozzle Joints I

skill_requirements:
  required:
    Gallente Industrial: 1
    Planetology: 1
  recommended:
    Gallente Industrial: 3
    Evasive Maneuvering: 3
    Shield Operation: 3

stats:
  ehp: 8000
  align_time: 7.0
  cargo: 600
  pi_hold: 45000
  validated_date: "2026-03-05"

notes:
  purpose: "Fast-align PI product hauler for highsec routes"
  engagement: "Warp between POCO and station, minimize time in space"
  warnings:
    - "PI hold is separate from cargo - only carries PI products"
    - "Low EHP - avoid autopilot, always warp gate-to-gate"
    - "Inertial stabilizers reduce align time but lower structure HP"
    - "Use instadock/undock bookmarks at trade hubs"

upgrade_path:
  next_tier: meta
  key_upgrades:
    - module: "Inertial Stabilizers I"
      upgrade_to: "Inertial Stabilizers II"
      skill_required: "Spaceship Command 3"
    - ship: "Occator (Deep Space Transport)"
      notes: "Much tankier PI hauling with fleet hangar"
