# Dragoon Hull Manifest
#
# The Dragoon is an Amarr T1 destroyer focused on drones and energy warfare.
# Unusual for Amarr in that drones are primary DPS, with neuts as force multiplier.

hull: Dragoon
class: destroyer
faction: amarr
tech_level: 1

slots:
  high: 5
  mid: 3
  low: 4
  rig: 3

drones:
  bandwidth: 25
  bay: 50

bonuses:
  - "10% bonus to drone damage and hitpoints per Amarr Destroyer level"
  - "20% bonus to Energy Nosferatu and Energy Neutralizer drain amount per Amarr Destroyer level"

roles:
  - drone_boat
  - armor_tank
  - ewar

fitting_rules:
  tank_type: armor_active
  weapons:
    primary: drones
    secondary: energy_neutralizers

  notes:
    - "Primary DPS from drones, not turrets"
    - "High slots best used for neuts/nos - drains enemy cap"
    - "Can fit 3 turrets but drone focus is superior"
    - "50m3 bay carries 2 full flights of lights"

drone_recommendations:
  primary: "Hobgoblin I"
  anti_frigate: "Warrior I"
  utility: "Salvage Drone I"

capacitor:
  stable_expected: false
  notes: "Neuts are cap hungry. Nos helps sustain. Manage cap carefully."

engagement:
  range: "0-10km (neut range)"
  speed: "Brawl with AB or kite with MWD"
  notes: "Neut enemy cap while drones apply DPS. Excellent in 1v1 frigate fights."
