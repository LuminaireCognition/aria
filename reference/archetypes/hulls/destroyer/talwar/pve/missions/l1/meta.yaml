notes:
  purpose: "L1 mission runner - fast rocket Talwar with shield buffer"
  engagement: "AB orbit at 5-10km, rockets apply well to frigate-class targets"
  warnings:
    - "Overdrive in lows for speed - signature tanking with speed + AB"
    - "Dual T2 BCS for maximum rocket DPS"
    - "Meta Arbalest launchers - good DPS without Rockets V"
    - "Rockets are short range but L1 missions have close engagements"
    - "ACR rig needed for fitting - tight powergrid"
    - "Carry multiple damage types - swap for mission-specific weakness"
    - "Fast ship - can speed tank many L1 enemies"

