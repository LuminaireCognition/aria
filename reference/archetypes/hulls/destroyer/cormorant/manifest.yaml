# Cormorant Hull Manifest
#
# The Cormorant is a Caldari T1 destroyer built around 7 small hybrid turrets.
# Railgun sniper or blaster brawler depending on fit. Shield tank with
# limited mid slots and minimal lows.

hull: Cormorant
class: destroyer
faction: caldari
tech_level: 1

# Slot layout
slots:
  high: 8  # 7 turret hardpoints + 1 utility
  mid: 3
  low: 2
  rig: 3

drones:
  bandwidth: 0
  bay: 0

bonuses:
  - "10% bonus to Small Hybrid Turret optimal range per Caldari Destroyer level"
  - "10% bonus to Small Hybrid Turret damage per Caldari Destroyer level"

roles:
  - turret_boat
  - shield_tank

fitting_rules:
  tank_type: shield_buffer

  weapons:
    primary: hybrids
    secondary: null

  notes:
    - "7 turret hardpoints - excellent small hybrid platform"
    - "8th high slot for utility (probe launcher, neut, or salvager)"
    - "Only 3 mid slots - limits tank and utility"
    - "2 low slots - damage mods or fitting mods only"
    - "Railguns for range (PvE), blasters for brawling (PvP)"
    - "No drone bay - pure turret DPS"

ammo_recommendations:
  brawling: "Antimatter Charge S (max DPS, short range)"
  general: "Uranium Charge S (balanced range/DPS)"
  sniping: "Iron Charge S (max range, reduced DPS)"
  note: "Hybrids deal Kinetic + Thermal damage. Swap ammo for range, not damage type."

capacitor:
  stable_expected: true
  notes: "Railguns are relatively cap-efficient. Blasters use more cap but fights are short."

engagement:
  range: "1-5km (blasters), 15-40km (railguns)"
  speed: "AB orbit for PvE, MWD for repositioning or PvP"
  notes: "Glass cannon. High alpha but thin tank. Kill targets before they kill you."
