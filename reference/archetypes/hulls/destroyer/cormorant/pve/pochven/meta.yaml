# Cormorant Pochven - Rogue Drone Standing Farm
#
# Specialized fit for increasing Triglavian standing by killing Rogue Drones
# in Pochven. MWD for fast repositioning between drone spawns. Sensor booster
# for faster target locks. Long-range railgun ammo to engage at distance.

archetype:
  hull: Cormorant
  skill_tier: meta
  omega_required: true

eft: |
  [Cormorant, Pochven Standing Increase vs Rogue Drone]
  Magnetic Field Stabilizer II
  Damage Control I

  5MN Quad LiF Restrained Microwarpdrive
  Alumel-Wired Enduring Sensor Booster
  Medium Azeotropic Restrained Shield Extender

  125mm Prototype Gauss Gun
  125mm Prototype Gauss Gun
  125mm Prototype Gauss Gun
  125mm Prototype Gauss Gun
  [Empty High slot]
  125mm Prototype Gauss Gun
  125mm Prototype Gauss Gun
  125mm Prototype Gauss Gun

  Small Polycarbon Engine Housing I
  Small Core Defense Field Extender I
  Small Core Defense Field Extender I


  Iron Charge S x2500

skill_requirements:
  required:
    Caldari Destroyer: 3
    Small Hybrid Turret: 3
    Navigation: 3
    Weapon Upgrades: 4
  recommended:
    Evasive Maneuvering: 3
    Acceleration Control: 3
    Long Range Targeting: 3

stats:
  # Pending EOS validation - run 'aria-esi eos-seed' then recalculate
  validated_date: null

