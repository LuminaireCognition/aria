      notes: "Max range ammo - engage drones at distance, avoid aggro from Triglavians"

notes:
  purpose: "Pochven Rogue Drone standing farm - kill drones to gain Triglavian standing"
  engagement: "MWD between drone spawns, snipe at max range with Iron ammo"
  warnings:
    - "DO NOT engage Triglavian NPCs - only shoot Rogue Drones"
    - "Iron Charge S for maximum range - stay away from other hostile NPCs"
    - "Sensor booster for faster lock times on small drone targets"
    - "Polycarbon engine housing rig for faster MWD speed"
    - "One empty high slot - fit a cloak or probe launcher if desired"
    - "Pochven is dangerous - watch for player activity in local"
    - "MWD signature bloom makes you vulnerable - pulse MWD, don't leave it running"
    - "This fit is for standing farm only - not for general PvE in Pochven"

