# Algos Hull Manifest
#
# The Algos is a Gallente T1 destroyer built around drones with hybrid turret support.
# Drone-focused with 35 Mbit bandwidth and 60m3 bay. 6 turret hardpoints for
# secondary hybrid DPS. Armor or shield tank viable.

hull: Algos
class: destroyer
faction: gallente
tech_level: 1

# Slot layout
slots:
  high: 6  # 5 turret hardpoints + 1 utility
  mid: 3
  low: 3
  rig: 3

drones:
  bandwidth: 35
  bay: 60

bonuses:
  - "10% bonus to Drone hitpoints and damage per Gallente Destroyer level"
  - "10% bonus to Small Hybrid Turret damage per Gallente Destroyer level"

roles:
  - drone_boat
  - turret_boat

fitting_rules:
  tank_type: armor_active
  tank_variants:
    - armor_active
    - shield_buffer

  weapons:
    primary: drones
    secondary: hybrids

  notes:
    - "35 Mbit bandwidth - can field 5 light drones or mix of medium/light"
    - "60m3 drone bay - carry spares for losses"
    - "5 turret hardpoints plus 1 utility high (probe launcher, salvager, drone link)"
    - "Drone bonuses are the primary DPS source"
    - "Hybrids are secondary DPS - fit railguns or autocannons depending on range"
    - "3 low slots allow armor tank or drone damage amplifiers"

drone_recommendations:
  medium: "Hammerhead I / Valkyrie I (depending on damage type)"
  light: "Hobgoblin I / Warrior I / Acolyte I (faction-matched)"
  note: "Drones allow full damage type selection. Match drones to enemy weakness."

capacitor:
  stable_expected: true
  notes: "Drones don't use cap. Only propulsion and active tank modules drain cap."

engagement:
  range: "5-20km (orbit with AB, drones do the work)"
  speed: "AB orbit for PvE, MWD for PvP repositioning"
  notes: "Drone boat - keep drones on target, use turrets for supplemental DPS."
