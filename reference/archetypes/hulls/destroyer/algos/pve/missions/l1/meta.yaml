stats:
  dps: 146  # pending recalculation with hybrid turrets
  ehp: 9084  # pending recalculation with hybrid turrets
  align_time: 5.0
  speed_ab: 698
  validated_date: "2026-02-27"

damage_tuning:
  default_damage: thermal
  tank_profile: shield_buffer

  overrides:
    serpentis:
      drones:
        light: "Hobgoblin I"
      notes: "Serpentis weak to Thermal - Hobgoblins deal Thermal"

    angel_cartel:
      drones:
        light: "Warrior I"
      notes: "Angels weak to Explosive - Warriors deal Explosive"

    blood_raiders:
      drones:
        light: "Acolyte I"
      notes: "Blood Raiders weak to EM - Acolytes deal EM"

    guristas:
      drones:
        light: "Hornet I"
      notes: "Guristas weak to Kinetic - Hornets deal Kinetic"

    rogue_drones:
      drones:
        light: "Acolyte I"
      notes: "Drones weak to EM - Acolytes deal EM"

notes:
  purpose: "L1 mission runner with probe launcher for opportunistic exploration"
  engagement: "Orbit at 10-15km with AB, let drones do primary DPS, railguns for supplemental"
  warnings:
    - "Nanofiber improves align time for warping between rooms"
    - "Probe launcher sacrifices 1 turret slot for scanning utility"
    - "EM shield reinforcer plugs the shield EM hole"
    - "Hybrid turrets benefit from Algos +50% turret damage bonus"
    - "Swap drone damage type to match faction weakness"

upgrade_path:
  next_tier: t2
  key_upgrades:
    - module: "125mm Compressed Coil Gun I"
      upgrade_to: "125mm Railgun II"
      skill_required: "Small Hybrid Turret 5"
    - module: "Compact Multispectrum Shield Hardener"
      upgrade_to: "Multispectrum Shield Hardener II"
      skill_required: "Tactical Shield Manipulation 4"
    - ship: "Vexor"
      notes: "Cruiser upgrade for L2 missions with 75 Mbit drone bandwidth"
