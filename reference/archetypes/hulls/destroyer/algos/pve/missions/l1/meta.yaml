    Gallente Destroyer: 3
    Drones: 5
    Light Drone Operation: 3
    Drone Avionics: 3
    Weapon Upgrades: 4
  recommended:
    Drone Sharpshooting: 3
    Drone Durability: 3
    Small Projectile Turret: 3
    Astrometrics: 3

stats:
  # Pending EOS validation - run 'aria-esi eos-seed' then recalculate
  validated_date: null

damage_tuning:
  default_damage: thermal
  tank_profile: shield_buffer

  overrides:
    serpentis:
      drones:
        light: "Federation Navy Hobgoblin"
      notes: "Serpentis weak to Thermal - Hobgoblins deal Thermal"

    angel_cartel:
      drones:
        light: "Republic Fleet Warrior"
      notes: "Angels weak to Explosive - Warriors deal Explosive"

    blood_raiders:
      drones:
        light: "Imperial Navy Acolyte"
      notes: "Blood Raiders weak to EM - Acolytes deal EM"

    guristas:
      drones:
        light: "Caldari Navy Hornet"
      notes: "Guristas weak to Kinetic - Hornets deal Kinetic"

    rogue_drones:
      drones:
        light: "Imperial Navy Acolyte"
      notes: "Drones weak to EM - Acolytes deal EM"

notes:
  purpose: "L1 mission runner with probe launcher for opportunistic exploration"
  engagement: "Orbit at 10-15km with AB, let drones do primary DPS, autocannons for supplemental"
  warnings:
    - "Dual T2 DDA in lows for maximum drone DPS"
    - "Probe launcher sacrifices 1 turret slot for scanning utility"
    - "EM shield reinforcer plugs the shield EM hole"
    - "Faction drones for extra performance - carry spares"
    - "Autocannons use no cap - good synergy with shield tank"
    - "Vespa medium drones for tougher targets (cruiser-class)"

upgrade_path:
  next_tier: t2
  key_upgrades:
    - module: "150mm Light Prototype Automatic Cannon"
      upgrade_to: "150mm AutoCannon II"
      skill_required: "Small Projectile Turret 5"
    - module: "Compact Multispectrum Shield Hardener"
      upgrade_to: "Multispectrum Shield Hardener II"
      skill_required: "Tactical Shield Manipulation 4"
    - ship: "Vexor"
      notes: "Cruiser upgrade for L2 missions with 75 Mbit drone bandwidth"
