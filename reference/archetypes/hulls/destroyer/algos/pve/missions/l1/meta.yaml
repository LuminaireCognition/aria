# Algos L1 Missions - iBeast HiSec PvE Shield Drone
#
# Shield-tanked drone Algos for L1 missions with probe launcher utility.
# T2 drone damage amplifiers for DPS, meta autocannons for secondary damage.
# Probe launcher in utility high for exploration between missions.

archetype:
  hull: Algos
  skill_tier: meta
  omega_required: true

attribution:
  author: iBeast
  source: HiSec PvE Community Fits
  license: community

eft: |
  [Algos, iBeast-HiSec PvE-Algos]
  IFFA Compact Damage Control
  Drone Damage Amplifier II
  Drone Damage Amplifier II

  1MN Monopropellant Enduring Afterburner
  Medium Azeotropic Restrained Shield Extender
  Compact Multispectrum Shield Hardener

  150mm Light Prototype Automatic Cannon
  150mm Light Prototype Automatic Cannon
  150mm Light Prototype Automatic Cannon
  Core Probe Launcher I
  150mm Light Prototype Automatic Cannon
  150mm Light Prototype Automatic Cannon

  Small EM Shield Reinforcer I
  Small Core Defense Field Extender I
  Small Core Defense Field Extender I


  Federation Navy Hobgoblin x5
  Caldari Navy Hornet x3
  Caldari Navy Vespa x2

  Phased Plasma S x2800
  Core Scanner Probe I x16

skill_requirements:
