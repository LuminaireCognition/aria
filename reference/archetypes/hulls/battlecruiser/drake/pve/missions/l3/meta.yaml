      ammo: "Inferno Heavy Assault Missile"
      notes: "Serpentis weak to Thermal"
    angel_cartel:
      ammo: "Nova Heavy Assault Missile"
      notes: "Angels weak to Explosive"
    blood_raiders:
      ammo: "Mjolnir Heavy Assault Missile"
      notes: "Blood Raiders weak to EM - watch for neuts"
