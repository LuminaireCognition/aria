# Harbinger L3 Missions - Medium Skill Variant
#
# Upgraded laser Harbinger for L3 missions.
# Better heat sinks and improved armor tank.

archetype:
  hull: Harbinger
  skill_tier: meta
  omega_required: false
roles:
  - missions-l3
source: eveuni

eft: |
  [Harbinger, L3 Missions - Medium Skills]

  Heat Sink I
  Heat Sink I
  Medium Armor Repairer I
  Multispectrum Energized Membrane I
  Multispectrum Energized Membrane I
  Reactive Armor Hardener
