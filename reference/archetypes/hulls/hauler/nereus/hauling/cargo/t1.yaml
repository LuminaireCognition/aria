# Nereus Hauler - Max Cargo with Cloak
#
# Maximum cargo capacity Nereus with expanded cargoholds and cargo rigs.
# Cloak for safety, shield buffer for gank deterrence.

archetype:
  hull: Nereus
  skill_tier: t1
  omega_required: false

eft: |
  [Nereus, Hauler Operations - Nereus]
  Damage Control I
  Expanded Cargohold II
  Expanded Cargohold II
  Expanded Cargohold II
  Expanded Cargohold II

  10MN Afterburner I
  Large Shield Extender I
