# Tormentor Hull Manifest
#
# The Tormentor is an Amarr T1 combat frigate with drone support.
# 3 turret hardpoints with laser capacitor bonus, plus drone bay.

hull: Tormentor
class: frigate
faction: amarr
tech_level: 1

slots:
  high: 3
  mid: 3
  low: 4
  rig: 3

drones:
  bandwidth: 25
  bay: 40

bonuses:
  - "10% bonus to Small Energy Turret capacitor use per Amarr Frigate level"
  - "5% bonus to Small Energy Turret damage per Amarr Frigate level"

roles:
  - turret_boat
  - drone_support
  - armor_tank

fitting_rules:
  tank_type: armor_active
  weapons:
    primary: lasers
    secondary: drones

  notes:
    - "3 turrets + drone bay for hybrid DPS"
    - "25 Mbit bandwidth - can field 5 light drones"
    - "3 mid slots - more utility than Punisher"
    - "4 low slots for armor tank"

crystal_recommendations:
  brawling: "Multifrequency S"
  general: "Standard S"
  sniping: "Radio S"
  note: "Crystals change range, not damage type (always EM/Thermal)"

capacitor:
  stable_expected: false
  notes: "Lasers + drones + active tank are cap hungry."

engagement:
  range: "2-5km (pulse), 8-12km (beam)"
  speed: "Brawl with AB, kite with MWD"
  notes: "Turret + drone DPS combo. More versatile than Punisher."
