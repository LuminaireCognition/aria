# Tristan L1 Missions - Low Skill Variant
#
# Drone-focused Tristan for L1 security missions.
# Five light drones provide all DPS. Armor tank.

archetype:
  hull: Tristan
  skill_tier: t1
  omega_required: false
roles:
  - missions-l1
source: eveuni

eft: |
  [Tristan, L1 Missions - Low Skills]

  Drone Damage Amplifier I
  Small Armor Repairer I
  Damage Control I

  1MN Afterburner I
  Cap Recharger I
  Drone Navigation Computer I

  [Empty High slot]
  [Empty High slot]
  [Empty High slot]

  Small Auxiliary Nano Pump I
  Small Auxiliary Nano Pump I
  Small Nanobot Accelerator I

  Hobgoblin I x5

skill_requirements:
  required:
    Gallente Frigate: 2
    Drones: 4
    Light Drone Operation: 2
  recommended:
    Drone Sharpshooting: 3
    Drone Durability: 3
    Repair Systems: 3

stats:
  dps: 75
  ehp: 3200
  align_time: 4.8
  speed_ab: 620
  validated_date: "2026-03-05"

damage_tuning:
  default_damage: thermal
  tank_profile: armor_active

  overrides:
    serpentis:
      drones:
        light: "Hobgoblin I"
      notes: "Serpentis weak to Thermal - Hobgoblins deal Thermal"
    angel_cartel:
      drones:
        light: "Warrior I"
      notes: "Angels weak to Explosive - Warriors deal Explosive"
    blood_raiders:
      drones:
        light: "Acolyte I"
      notes: "Blood Raiders weak to EM - Acolytes deal EM"
    guristas:
      drones:
        light: "Hornet I"
      notes: "Guristas weak to Kinetic - Hornets deal Kinetic"

notes:
  purpose: "Drone-based L1 mission runner - set drones and orbit"
  engagement: "Orbit at 15-20km with AB, let drones do all DPS"
  warnings:
    - "Recall drones before warping"
    - "Watch drone health vs multiple enemies"
    - "Swap drone type to match faction weakness"
    - "Cap stable with repairer running"

upgrade_path:
  next_tier: meta
  key_upgrades:
    - module: "Drone Damage Amplifier I"
      upgrade_to: "Drone Damage Amplifier II"
      skill_required: "Weapon Upgrades 4"
    - module: "Hobgoblin I"
      upgrade_to: "Hobgoblin II"
      skill_required: "Light Drone Operation 5"
    - ship: "Vexor"
      notes: "Cruiser upgrade for L2 missions with medium drones"
